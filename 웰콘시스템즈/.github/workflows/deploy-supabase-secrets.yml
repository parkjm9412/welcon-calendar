name: Deploy Supabase Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-supabase-secrets.yml'
  workflow_dispatch:

env:
  SUPABASE_URL: https://ayviqkbjmmydnvszwwcs.supabase.co
  SUPABASE_PROJECT_ID: ayviqkbjmmydnvszwwcs

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Set Supabase Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          supabase secrets set GOOGLE_CLIENT_EMAIL="${GOOGLE_CLIENT_EMAIL}"
          supabase secrets set GOOGLE_PRIVATE_KEY="${GOOGLE_PRIVATE_KEY}"
        working-directory: ./웰콘시스템즈

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy sync-calendars
        working-directory: ./웰콘시스템즈

      - name: Deployment Success
        run: echo "✅ Supabase secrets and Edge Functions deployed successfully!"
